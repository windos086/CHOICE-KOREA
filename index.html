<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- 크롤링 및 검색 인덱싱 절대 방지 (Prevent Crawling & Indexing) -->
    <meta name="robots" content="noindex, nofollow, noimageindex, noarchive, nosnippet" />
    <meta name="googlebot" content="noindex, nofollow, noimageindex, noarchive, nosnippet" />
    <meta name="naverbot" content="noindex, nofollow" />
    <meta name="daumoa" content="noindex, nofollow" />
    
    <!-- 오픈 그래프 명시적 제거/비우기 (Explicitly empty Open Graph tags to override fallback scraper rules) -->
    <meta property="og:title" content="" />
    <meta property="og:description" content="" />
    <meta property="og:image" content="" />
    <meta property="og:url" content="" />
    <meta property="og:type" content="" />
    <meta property="og:site_name" content="" />
    
    <!-- 트위터 카드 비우기 (Explicitly empty Twitter card info) -->
    <meta name="twitter:title" content="" />
    <meta name="twitter:description" content="" />
    <meta name="twitter:image" content="" />
    <meta name="twitter:card" content="summary" />
    
    <!-- 기본 타이틀 비우기 (Empty standard title tag) -->
    <title></title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
